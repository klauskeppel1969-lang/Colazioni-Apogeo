    <h1>☕ ORDINE COLAZIONI</h1>
    <div id="header-right">
      <button id="btn-invia-hdr">
        <span class="icon">📤</span>INVIA
      </button>
      <span id="badge-count">0</span>
      <span id="sync-status" class="local">◌</span>
    </div>
  </header>

  <!-- ═══ TOOLBAR FILTRI ═══ -->
  <nav id="toolbar">
    <button class="filter-btn active" data-filter="all">TUTTI</button>
    <button class="filter-btn" data-filter="selected">DA ORDINARE</button>
  </nav>

  <!-- ═══ LISTA ARTICOLI ═══ -->
  <main id="products-list"></main>

  <!-- ═══ AREA STAMPA ═══ -->
  <div id="print-area"></div>

  <!-- ═══ BOTTOM BAR ═══ -->
  <nav id="bottom-bar">
    <button class="bottom-btn" id="btn-add-extra">
      <span class="icon">＋</span><span>EXTRA</span>
    </button>
    <button class="bottom-btn" id="btn-print">
      <span class="icon">🖨</span><span>STAMPA</span>
    </button>
    <button class="bottom-btn" id="btn-altro">
      <span class="icon">⋯</span><span>ALTRO</span>
    </button>
    <button class="bottom-btn" id="btn-reset">
      <span class="icon">↺</span><span>RESET</span>
    </button>
  </nav>


  <!-- ═══ PANEL: INVIA ORDINE ═══ -->
  <div class="panel-overlay hidden" id="invia-panel">
    <div class="panel-box">
      <div class="panel-header">
        <h2>📤 INVIA ORDINE</h2>
        <button class="panel-close" id="invia-close">CHIUDI</button>
      </div>
      <div class="panel-body" id="invia-body"></div>
    </div>
  </div>

  <!-- ═══ PANEL: ALTRO ═══ -->
  <div class="panel-overlay hidden" id="altro-panel">
    <div class="panel-box" style="height:auto;max-height:55vh;border-radius:12px 12px 0 0;">
      <div class="panel-header">
        <h2>⋯ ALTRO</h2>
        <button class="panel-close" id="altro-close">CHIUDI</button>
      </div>
      <div class="panel-body" style="padding:14px;">
        <button class="altro-btn" id="btn-storico">
          <span>📋</span><span>STORICO ORDINI</span>
        </button>
        <button class="altro-btn" id="btn-stats">
          <span>📊</span><span>STATISTICHE</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ═══ PANEL: STORICO ═══ -->
  <div class="panel-overlay hidden" id="storico-panel">
    <div class="panel-box">
      <div class="panel-header">
        <h2>📋 STORICO ORDINI</h2>
        <div style="display:flex;gap:6px;align-items:center;">
          <button onclick="salvaOrdineCorrente()" style="background:#1e3e0e;color:#9ad46a;border:1px solid #3a6a20;font-family:monospace;font-size:0.68rem;font-weight:700;padding:5px 10px;border-radius:3px;cursor:pointer;">💾 SALVA</button>
          <button class="panel-close" id="storico-close">CHIUDI</button>
        </div>
      </div>
      <div class="panel-body" id="storico-body">
        <div class="empty-panel">Caricamento…</div>
      </div>
    </div>
  </div>

  <!-- ═══ PANEL: STATS ═══ -->
  <div class="panel-overlay hidden" id="stats-panel">
    <div class="panel-box">
      <div class="panel-header">
        <h2>📊 STATISTICHE ORDINI</h2>
        <button class="panel-close" id="stats-close">CHIUDI</button>
      </div>
      <div class="panel-body" id="stats-body">
        <div class="empty-panel">Caricamento…</div>
      </div>
    </div>
  </div>


  <!-- ═══ MODAL: NOTE ═══ -->
  <div class="modal-overlay hidden" id="note-modal">
    <div class="modal-box">
      <h2>📝 NOTE — <span id="note-modal-title"></span></h2>
      <label for="note-input">Nota ordine</label>
      <textarea id="note-input" placeholder="es. solo se in offerta, marca specifica…" rows="3"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" id="note-modal-cancel">ANNULLA</button>
        <button class="btn-ok"     id="note-modal-ok">SALVA</button>
      </div>
    </div>
  </div>

  <!-- ═══ MODAL: EXTRA ═══ -->
  <div class="modal-overlay hidden" id="extra-modal">
    <div class="modal-box">
      <h2>＋ ARTICOLO EXTRA</h2>
      <label for="extra-name">Nome articolo *</label>
      <input type="text" id="extra-name" placeholder="es. Succo Mango…">
      <label for="extra-cat">Categoria</label>
      <select id="extra-cat">
        <option value="Extra">Extra</option>
        <option value="Cornetti">Cornetti</option>
        <option value="Dolci">Dolci</option>
        <option value="Cereali">Cereali</option>
        <option value="Marmellate">Marmellate</option>
        <option value="Dolcificanti">Dolcificanti</option>
        <option value="Yogurt">Yogurt</option>
        <option value="Infusi">Infusi</option>
        <option value="Bevande">Bevande</option>
        <option value="Latticini">Latticini</option>
        <option value="Senza Glutine">Senza Glutine</option>
        <option value="Monouso">Monouso</option>
        <option value="Varie">Varie</option>
      </select>
      <label for="extra-qty">Quantità</label>
      <input type="number" id="extra-qty" value="1" min="1" max="999">
      <label for="extra-note">Note (opzionale)</label>
      <input type="text" id="extra-note" placeholder="es. per evento, senza lattosio…">
      <div class="modal-actions">
        <button class="btn-cancel" id="extra-modal-cancel">ANNULLA</button>
        <button class="btn-ok"     id="extra-modal-ok">AGGIUNGI</button>
      </div>
    </div>
  </div>

  <!-- ═══ MODAL: ELIMINA EXTRA ═══ -->
  <div class="modal-overlay hidden" id="del-modal">
    <div class="modal-box">
      <h2>✕ ELIMINA EXTRA</h2>
      <p style="font-size:0.82rem;color:#aaa;margin-bottom:4px">
        Eliminare <strong id="del-modal-name" style="color:#e0b050"></strong>?
      </p>
      <div class="modal-actions">
        <button class="btn-cancel" id="del-modal-cancel">ANNULLA</button>
        <button class="btn-danger" id="del-modal-ok">ELIMINA</button>
      </div>
    </div>
  </div>

  <!-- ═══ MODAL: RESET ═══ -->
  <div class="modal-overlay hidden" id="reset-modal">
    <div class="modal-box">
      <h2>↺ RESET ORDINE</h2>
      <p style="font-size:0.82rem;color:#aaa;margin-bottom:4px">
        Azzera selezioni, quantità, note e articoli extra.<br>
        <strong style="color:#cc5050">Operazione irreversibile.</strong>
      </p>
      <div class="modal-actions">
        <button class="btn-cancel" id="reset-modal-cancel">ANNULLA</button>
        <button class="btn-danger" id="reset-modal-ok">RESET</button>
      </div>
    </div>
  </div>


  <!-- ═══ SCRIPT ═══ -->
  <script src="products.js"></script>
  <script src="contacts.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>

</body>
</html>
