<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ordine Colazioni</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ======== HEADER FISSO ======== -->
  <header id="app-header">
    <h1>☕ ORDINE COLAZIONI</h1>
    <div id="header-right">
      <span id="badge-count">0</span>
      <span id="sync-status" class="local">◌ locale</span>
    </div>
  </header>

  <!-- ======== TOOLBAR FILTRI ======== -->
  <nav id="toolbar">
    <button class="filter-btn active" data-filter="all">TUTTI</button>
    <button class="filter-btn" data-filter="selected">DA ORDINARE</button>
  </nav>

  <!-- ======== LISTA ARTICOLI ======== -->
  <main id="products-list">
    <!-- popolato da app.js -->
  </main>

  <!-- ======== BARRA AZIONI FISSA ======== -->
  <nav id="bottom-bar">
    <button class="bottom-btn" id="btn-add-extra">
      <span class="icon">＋</span>
      <span>EXTRA</span>
    </button>
    <button class="bottom-btn" id="btn-save">
      <span class="icon">💾</span>
      <span>STORICO</span>
    </button>
    <button class="bottom-btn" id="btn-print">
      <span class="icon">🖨</span>
      <span>STAMPA</span>
    </button>
    <button class="bottom-btn" id="btn-reset">
      <span class="icon">↺</span>
      <span>RESET</span>
    </button>
  </nav>


  <!-- ======================================================
       MODAL: NOTE ARTICOLO
       ====================================================== -->
  <div class="modal-overlay hidden" id="note-modal">
    <div class="modal-box">
      <h2>📝 NOTE — <span id="note-modal-title"></span></h2>
      <label for="note-input">Note ordine</label>
      <textarea id="note-input" placeholder="es. solo se in offerta, marca specifica…" rows="3"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" id="note-modal-cancel">ANNULLA</button>
        <button class="btn-ok"     id="note-modal-ok">SALVA</button>
      </div>
    </div>
  </div>


  <!-- ======================================================
       MODAL: AGGIUNGI ARTICOLO EXTRA
       ====================================================== -->
  <div class="modal-overlay hidden" id="extra-modal">
    <div class="modal-box">
      <h2>＋ ARTICOLO EXTRA</h2>

      <label for="extra-name">Nome articolo *</label>
      <input type="text" id="extra-name" placeholder="es. Succo Mango, Croissant Senza Glutine…">

      <label for="extra-cat">Categoria</label>
      <select id="extra-cat">
        <option value="Extra">Extra</option>
        <option value="Cornetti">Cornetti</option>
        <option value="Dolci">Dolci</option>
        <option value="Bevande">Bevande</option>
        <option value="Yogurt">Yogurt</option>
        <option value="Salumi">Salumi</option>
        <option value="Formaggi">Formaggi</option>
        <option value="Frigo">Frigo</option>
        <option value="Monouso">Monouso</option>
      </select>

      <label for="extra-qty">Quantità</label>
      <input type="number" id="extra-qty" value="1" min="1" max="999">

      <label for="extra-note">Note (opzionale)</label>
      <input type="text" id="extra-note" placeholder="es. per evento squadra, senza lattosio…">

      <div class="modal-actions">
        <button class="btn-cancel" id="extra-modal-cancel">ANNULLA</button>
        <button class="btn-ok"     id="extra-modal-ok">AGGIUNGI</button>
      </div>
    </div>
  </div>


  <!-- ======================================================
       MODAL: CONFERMA ELIMINA EXTRA
       ====================================================== -->
  <div class="modal-overlay hidden" id="del-modal">
    <div class="modal-box">
      <h2>✕ ELIMINA EXTRA</h2>
      <p style="font-size:0.82rem;color:#aaa;margin-bottom:8px">
        Eliminare l'articolo extra <strong id="del-modal-name" style="color:#c8a45a"></strong>?
      </p>
      <div class="modal-actions">
        <button class="btn-cancel" id="del-modal-cancel">ANNULLA</button>
        <button class="btn-danger" id="del-modal-ok">ELIMINA</button>
      </div>
    </div>
  </div>


  <!-- ======================================================
       MODAL: CONFERMA RESET
       ====================================================== -->
  <div class="modal-overlay hidden" id="reset-modal">
    <div class="modal-box">
      <h2>↺ RESET ORDINE</h2>
      <p style="font-size:0.82rem;color:#aaa;margin-bottom:8px">
        Azzera tutte le selezioni, quantità, note e articoli extra.<br>
        <strong style="color:#cc6666">Operazione irreversibile.</strong>
      </p>
      <div class="modal-actions">
        <button class="btn-cancel" id="reset-modal-cancel">ANNULLA</button>
        <button class="btn-danger" id="reset-modal-ok">RESET</button>
      </div>
    </div>
  </div>


  <!-- ======================================================
       SCRIPT (ordine obbligatorio)
       ====================================================== -->

  <!-- 1. Prodotti standard -->
  <script src="products.js"></script>

  <!-- 2. Configurazione Firebase -->
  <script src="firebase-config.js"></script>

  <!-- 3. Firebase SDK (CDN) — v9 compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- 4. Logica app -->
  <script src="app.js"></script>

</body>
</html>
